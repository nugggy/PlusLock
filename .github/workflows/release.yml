name: Release

# Push a tag like v0.2.0 (stable) or v0.2.0-beta.1 (beta) to publish a signed APK.
# Phones running PlusLock pick it up through the in-app updater.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing. See README, section 'Publishing a release'."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Ppluslock.version="${GITHUB_REF_NAME#v}" --no-daemon

      - name: Name and checksum
        run: |
          APK="PlusLock-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" | awk '{print $1}' > "$APK.sha256"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PlusLock-${{ github.ref_name }}.apk
            PlusLock-${{ github.ref_name }}.apk.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
